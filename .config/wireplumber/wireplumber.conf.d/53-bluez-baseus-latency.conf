# Baseus Inspire XC1: prefer plain SBC for lower latency (lip sync) without dropouts
# (SBC-XQ caused audio gaps), then SBC-XQ, then AAC.
# Applies when no stored profile exists (e.g. after re-pairing or clearing ~/.local/state/wireplumber).
device.profile.priority.rules = [
  {
    matches = [ { device.name = "bluez_card.38_FB_A0_31_46_F5" } ]
    actions = {
      update-props = {
        priorities = [ a2dp-sink-sbc, a2dp-sink-sbc_xq, a2dp-sink ]
      }
    }
  }
]
