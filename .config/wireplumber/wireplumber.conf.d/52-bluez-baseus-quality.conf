# Baseus Inspire XC1: LDAC (enable in Baseus app) at hq, AAC maxed as fallback.
# ldac.quality: hq = 990 kbps, sq = 660, mq = 330, auto = adaptive (use if it stutters).
# bitratemode: 0 = CBR (default), 1-5 = VBR quality (5 = highest).
# If you hear dropouts/stutter, try 4 or go back to 0.
monitor.bluez.rules = [
  {
    matches = [ { device.name = "bluez_card.38_FB_A0_31_46_F5" } ]
    actions = {
      update-props = {
        bluez5.a2dp.aac.bitratemode = 5
        bluez5.codecs = [ ldac aac sbc_xq sbc ]
        bluez5.a2dp.ldac.quality = "hq"
      }
    }
  }
]
