# SYSC-Greet Hyprland config for greetd greeter session

# Explicit monitor config: DP-3 is primary, DP-2 is secondary
monitor=DP-3,preferred,0x0,1
monitor=DP-2,preferred,-2560x0,1,transform,1

# No animations for faster greeter startup
animations {
    enabled = false
}

# Minimal decorations
decoration {
    rounding = 0
    blur {
        enabled = false
    }
}

# Greeter doesn't need gaps
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

# Disable Hyprland wallpaper/logo for greeter
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(000000)
}

# Input configuration
input {
    kb_layout = us
    repeat_delay = 400
    repeat_rate = 40

    touchpad {
        tap-to-click = true
    }
}

# Uncomment to hide cursor completely
# cursor {
#     invisible = true
# }

# Disable all keybindings (security for greeter)
# No binds = no user control

# Window rules for kitty greeter
windowrule = fullscreen, class:kitty
windowrule = opacity 1.0 override, class:kitty
windowrule = monitor DP-3, class:kitty

# Layer rules for wallpaper daemon
layerrule = blur, wallpaper

# Force primary monitor
workspace = name:1, monitor:DP-3
exec-once = hyprctl dispatch workspace 1

# Startup applications
exec-once = swww-daemon
exec-once = XDG_CACHE_HOME=/tmp/greeter-cache HOME=/var/lib/greeter kitty --start-as=fullscreen --config=/etc/greetd/kitty.conf /usr/local/bin/sysc-greet && hyprctl dispatch exit
